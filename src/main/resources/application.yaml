spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eyeglasses_store?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create  # create = xóa và tạo lại bảng mỗi lần khởi động (chỉ dùng dev)
    show-sql: true
    properties:
      hibernate.format_sql: true

  devtools:
    restart:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api/v1
