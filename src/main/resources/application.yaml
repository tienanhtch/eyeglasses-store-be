spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eyeglasses_store?useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none  
    show-sql: true
    properties:
      hibernate.format_sql: true

  devtools:
    restart:
      enabled: true

server:
