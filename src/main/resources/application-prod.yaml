spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eyeglasses_store_prod?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

logging:
  level:
    com.eyeglasses.eyeglasses_store: INFO
    org.springframework.security: WARN
